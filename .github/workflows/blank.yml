name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon -x test -Pkotlin.compiler.execution.strategy=in-process || gradle assembleDebug --no-daemon -x test -Pkotlin.compiler.execution.strategy=in-process

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: app/build/outputs/apk/debug/*.apk
