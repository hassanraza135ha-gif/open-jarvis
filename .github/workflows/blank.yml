name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace --continue -x test 2>&1 | tee build_full.log
          if [ ! -f app/build/outputs/apk/debug/*.apk ]; then
            echo "=== FAILED COMPILATION LOGS ==="
            grep -E "(e: |error: |FAILURE: )" build_full.log || tail -n 120 build_full.log
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: app/build/outputs/apk/debug/*.apk
